<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Island Mode</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10131c;color:#f5f7ff;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:760px;margin:auto;padding:18px}.card{background:#1b2130;border:1px solid #30394d;border-radius:20px;padding:18px;margin-bottom:14px}
h1{font-size:28px;margin:0 0 6px}.muted{color:#aeb8ca}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{appearance:none;border:0;border-radius:15px;padding:15px 10px;background:#30394d;color:#fff;font-size:16px;font-weight:600}
button:active{transform:scale(.98)}.purple{background:#6d43d9}.red{background:#a83250}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}.team{background:#111722;border-radius:15px;padding:13px}
.team h3{margin:0 0 8px}.team p{margin:5px 0}.out{text-decoration:line-through;color:#697386}
#log{line-height:1.55;white-space:pre-line;min-height:110px}
@media(max-width:520px){.teams{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<section class="card">
<h1>🏝️ Island Mode</h1>
<div class="muted">Остров хаоса · 20 участников</div>
</section>

<section class="card">
<div class="buttons">
<button class="purple" onclick="randomAction()">🎲 РАНДОМ</button>
<button onclick="challenge()">⚔️ ИСПЫТАНИЕ</button>
<button onclick="eventAction()">💬 СОБЫТИЕ</button>
<button class="red" onclick="vote()">🗳️ ГОЛОСОВАНИЕ</button>
<button onclick="status()">📊 СТАТУС</button>
<button onclick="newGame()">↻ НОВАЯ ИГРА</button>
</div>
</section>

<section class="card"><div id="teams"></div></section>
<section class="card"><div id="log">Нажми 🎲 РАНДОМ, чтобы начать.</div></section>
</main>

<script>
const names=[
"Леви Аккерман","Монокума","Кэт Нуар","Венти","Юри","Аяно Айши",
"Коннор","Твайлайт Спаркл","Шэдоу","Шугар Куки","Вилли Вонка",
"Дазай Осаму","Санс","Аластор","Джакс","Грегори","Хацунэ Мику",
"Киллуа Золдик","Рей Аянами","Эдвард Элрик"
];
let alive=[],teamA=[],teamB=[],out=[],round=1,immune=null;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function newGame(){
 alive=shuffle(names).map((name,i)=>({name,team:i<10?"A":"B"}));
 teamA=alive.slice(0,10);teamB=alive.slice(10);out=[];round=1;immune=null;
 render();say("🏝️ ИГРА НАЧАЛАСЬ!\n\n20 участников распределены по двум командам.\nМонокума — обычный участник.");
}
function living(t){return (t==="A"?teamA:teamB).filter(p=>alive.includes(p))}
function render(){
 const list=(arr)=>arr.map(p=>`<p class="${alive.includes(p)?"":"out"}">${p.name}${p===immune?" 🛡️":""}</p>`).join("");
 document.getElementById("teams").innerHTML=
 `<div class="teams"><div class="team"><h3>🔴 Команда A</h3>${list(teamA)}</div>
 <div class="team"><h3>🔵 Команда B</h3>${list(teamB)}</div></div>`;
}
function say(x){document.getElementById("log").textContent=x}
function challenge(){
 const a=living("A"),b=living("B");
 if(!a.length||!b.length)return say("⚠️ Одна команда уже полностью выбыла.");
 const winner=Math.random()<.5?"A":"B",loser=winner==="A"?"B":"A";
 say(`⚔️ ИСПЫТАНИЕ ${round}\n\n🏆 Побеждает команда ${winner}!\n😈 Команда ${loser} идёт на голосование.`);
 round++;
}
function vote(){
 if(alive.length<=3)return say("🏆 Уже финальная стадия!");
 let candidates=alive.filter(p=>p!==immune);
 if(!candidates.length){immune=null;return vote()}
 const target=pick(candidates);
 alive=alive.filter(p=>p!==target);out.push(target);immune=null;
 say(`🗳️ ГОЛОСОВАНИЕ\n\n💀 Выбывает: ${target.name}\n\nОсталось: ${alive.length}`);
 render();
}
function eventAction(){
 const a=pick(alive),others=alive.filter(x=>x!==a),b=pick(others);
 const e=[
 `${a.name} и ${b.name} неожиданно заключают союз 🤝`,
 `${a.name} вступает в конфликт с ${b.name} 💢`,
 `${a.name} находит тайник с припасами 🎁`,
 `${a.name} раскрывает секрет ${b.name} 👀`,
 `${a.name} спасает ${b.name} во время испытания 🫶`,
 `${a.name} решает действовать в одиночку 😈`
 ];
 say("💬 СЛУЧАЙНОЕ СОБЫТИЕ\n\n"+pick(e));
}
function randomAction(){
 const r=Math.floor(Math.random()*5);
 if(r===0)challenge();
 else if(r===1||r===2)eventAction();
 else if(r===3)vote();
 else{
   immune=pick(alive);
   say(`🎲 РАНДОМ\n\n🛡️ ${immune.name} получает иммунитет!\nОн/она не может вылететь при следующем голосовании.`);
   render();
 }
}
function status(){
 say(`📊 СТАТУС\n\nОсталось: ${alive.length}\nВыбыло: ${out.length}\nРаунд: ${round}\nИммунитет: ${immune?immune.name:"нет"}\n\n💀 Выбывшие:\n${out.length?out.map(x=>x.name).join(", "):"никого"}`);
}
newGame();
</script>
</body>
</html>
