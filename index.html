<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Island Mode — Chaos Island</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0e1118;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:820px;margin:auto;padding:16px}.card{background:#191f2b;border:1px solid #30394a;border-radius:20px;padding:16px;margin-bottom:12px}
h1,h2,h3{margin-top:0}.muted{color:#aeb7c8}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px}
button{border:0;border-radius:13px;padding:14px;background:#30394a;color:white;font-size:15px;font-weight:650}
button:active{transform:scale(.98)}.primary{background:#6941d9}.danger{background:#a72f4b}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}.team{background:#10151e;border-radius:15px;padding:12px}
.team p{margin:5px 0}.out{text-decoration:line-through;color:#667184}.immune{font-weight:700}
#log{white-space:pre-line;line-height:1.55;min-height:130px}
.stat{display:flex;gap:18px;flex-wrap:wrap;color:#cbd3df}.pill{background:#252d3b;padding:5px 9px;border-radius:99px}
@media(max-width:550px){.teams{grid-template-columns:1fr}}
</style>
</head>
<body><main>
<section class="card"><h1>🏝️ Island Mode</h1><div class="muted">Остров хаоса · последовательная симуляция</div></section>

<section class="card">
<div class="stat"><span class="pill">Раунд: <b id="round">1</b></span><span class="pill">Осталось: <b id="count">20</b></span><span class="pill">Фаза: <b id="phase">команды</b></span></div>
</section>

<section class="card"><div class="buttons">
<button class="primary" onclick="next()">▶️ СЛЕДУЮЩИЙ ХОД</button>
<button onclick="challenge()">⚔️ ИСПЫТАНИЕ</button>
<button onclick="eventAction()">💬 СОБЫТИЕ</button>
<button class="danger" onclick="vote()">🗳️ ГОЛОСОВАНИЕ</button>
<button onclick="status()">📊 СТАТУС</button>
<button onclick="newGame()">↻ НОВАЯ ИГРА</button>
</div></section>

<section class="card"><div id="teams"></div></section>
<section class="card"><h3>📖 Хроника</h3><div id="log">Игра готова.</div></section>
</main>
<script>
const names=[
["Леви Аккерман","Attack on Titan"],["Монокума","Danganronpa"],["Кэт Нуар","Miraculous Ladybug"],["Венти","Genshin Impact"],["Юри","Doki Doki Literature Club"],
["Аяно Айши","Yandere Simulator"],["Коннор","Detroit: Become Human"],["Твайлайт Спаркл","My Little Pony"],["Шэдоу","Sonic the Hedgehog"],["Шугар Куки","Cookie Run: Kingdom"],
["Вилли Вонка","Charlie and the Chocolate Factory"],["Дазай Осаму","Bungou Stray Dogs"],["Санс","Undertale"],["Аластор","Hazbin Hotel"],["Джакс","The Amazing Digital Circus"],
["Грегори","FNAF: Security Breach"],["Хацунэ Мику","Vocaloid"],["Киллуа Золдик","Hunter × Hunter"],["Рей Аянами","Neon Genesis Evangelion"],["Эдвард Элрик","Fullmetal Alchemist"]
];
let players=[],out=[],round=1,phase="teams",loserTeam=null,immune=null,history=[],lastWinner=null;

const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function living(){return players.filter(p=>p.alive)}
function team(t){return players.filter(p=>p.alive&&p.team===t)}
function newGame(){
 let s=shuffle(names);
 players=s.map((x,i)=>({id:i,name:x[0],fandom:x[1],team:i<10?"A":"B",alive:true}));
 out=[];round=1;phase="teams";loserTeam=null;immune=null;history=[];
 render();say("🏝️ ДЕНЬ 1\n\n20 участников прибыли на остров.\nКоманды распределены случайно.\n\nНажми «▶️ СЛЕДУЮЩИЙ ХОД» — симуляция сама будет двигаться последовательно.");
}
function render(){
 const arr=t=>players.filter(p=>p.team===t).map(p=>`<p class="${p.alive?'':'out'} ${p===immune?'immune':''}">${p.name}${p===immune?' 🛡️':''}</p>`).join("");
 document.getElementById("teams").innerHTML=`<div class="teams">
<div class="team"><h3>🔴 Команда A</h3>${arr("A")}</div>
<div class="team"><h3>🔵 Команда B</h3>${arr("B")}</div></div>`;
 document.getElementById("round").textContent=round;
 document.getElementById("count").textContent=living().length;
 document.getElementById("phase").textContent=phase;
}
function say(x){document.getElementById("log").textContent=x;history.push(x)}
function challenge(){
 if(living().length<=10){phase="merge";return merge();}
 const a=team("A"),b=team("B");
 if(!a.length||!b.length){phase="merge";return merge();}
 const winner=Math.random()<.5?"A":"B";loserTeam=winner==="A"?"B":"A";
 phase="vote";
 lastWinner=winner;
 immune=null;
 say(`⚔️ ИСПЫТАНИЕ — РАУНД ${round}\n\nКоманда ${winner} побеждает! 🏆\n\nКоманда ${loserTeam} проиграла и отправляется на племенное голосование.\n\nТеперь нажми 🗳️ ГОЛОСОВАНИЕ.`);
 render();
}
function vote(){
 if(phase!=="vote") return say("🗳️ Сейчас голосование не проводится. Сначала нужно провести испытание.");
 let candidates=team(loserTeam).filter(p=>p!==immune);
 if(!candidates.length)candidates=team(loserTeam);
 const target=pick(candidates);
 target.alive=false;out.push(target);
 say(`🗳️ ГОЛОСОВАНИЕ — РАУНД ${round}\n\nПосле голосования ${target.name} получает больше всего голосов.\n\n💀 ВЫБЫВАЕТ: ${target.name}\n${target.fandom}\n\nОсталось: ${living().length}`);
 immune=null;loserTeam=null;round++;
 if(living().length<=10){merge();}else{phase="event";render();}
}
function merge(){
 phase="merge";loserTeam=null;
 players.filter(p=>p.alive).forEach(p=>p.team="M");
 say(`🔥 СЛИЯНИЕ!\n\nОсталось ${living().length} участников.\nКоманды распущены — теперь каждый играет за себя.\n\nСледующее голосование будет индивидуальным.`);
 render();
}
function individualChallenge(){
 phase="individualVote";
 const a=living(); const winner=pick(a); immune=winner;
 say(`⚔️ ИНДИВИДУАЛЬНОЕ ИСПЫТАНИЕ\n\n🏆 ${winner.name} побеждает и получает иммунитет!\n\nНажми 🗳️ ГОЛОСОВАНИЕ.`);
 render();
}
function individualVote(){
 let candidates=living().filter(p=>p!==immune);
 if(candidates.length<=2)return finale();
 const target=pick(candidates);target.alive=false;out.push(target);
 say(`🗳️ ФИНАЛЬНАЯ СТАДИЯ\n\n💀 ${target.name} выбывает.\n\nОсталось: ${living().length}`);
 immune=null;round++;
 if(living().length<=2)finale(); else {phase="event";render();}
}
function eventAction(){
 const a=living();if(a.length<2)return;
 const x=pick(a),y=pick(a.filter(p=>p!==x));
 const events=[
 `${x.name} и ${y.name} заключают тайный союз 🤝`,
 `${x.name} ссорится с ${y.name} из-за припасов 💢`,
 `${x.name} находит скрытый тайник острова 🎁`,
 `${x.name} начинает подозревать ${y.name} 👀`,
 `${x.name} неожиданно спасает ${y.name} 🫶`,
 `${x.name} раскрывает секрет ${y.name}. Альянс оказывается под угрозой.`
 ];
 say(`💬 СЛУЧАЙНОЕ СОБЫТИЕ\n\n${pick(events)}`);
 render();
}
function next(){
 if(living().length<=2)return finale();
 if(phase==="teams"||phase==="event"){if(living().length>10)challenge();else {if(phase!=="merge")merge(); else individualChallenge();}}
 else if(phase==="vote")vote();
 else if(phase==="individualVote")individualVote();
 else if(phase==="merge")individualChallenge();
 else eventAction();
}
function status(){
 const alive=living().map(p=>p.name).join(", ");
 say(`📊 СТАТУС\n\nОсталось: ${living().length}\nВыбыло: ${out.length}\nФаза: ${phase}\nИммунитет: ${immune?immune.name:"нет"}\n\nЖИВЫЕ:\n${alive}`);
}
function finale(){
 const a=living();
 if(a.length>2)return;
 phase="finale";
 if(a.length===2){
  const winner=pick(a),second=a.find(p=>p!==winner);
  say(`🏆 ФИНАЛ\n\n${winner.name} получает больше финальных голосов!\n\n👑 ПОБЕДИТЕЛЬ: ${winner.name}\n🥈 Второе место: ${second.name}`);
 }else if(a.length===1)say(`👑 ПОБЕДИТЕЛЬ: ${a[0].name}`);
 render();
}
newGame();
</script></body></html>
